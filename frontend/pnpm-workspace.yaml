# pnpm workspace / build-script allow-list
#
# This file exists for two reasons:
#
# 1. Build-script approval. pnpm 10+ refuses to install when a dependency has an
#    unapproved postinstall script and exits with ERR_PNPM_IGNORED_BUILDS.
#    Both spellings are declared so the Docker build (pnpm 9) and local builds
#    (pnpm 11/12) accept the same lockfile:
#      - onlyBuiltDependencies / allowBuilds
#    esbuild and vue-demi are the only packages this project needs to build.
#
# 2. pnpm 9 treats the mere presence of this file as "this is a workspace root"
#    and then hard-fails with `packages field missing or empty`. Declaring the
#    single package directory keeps pnpm 9 happy; pnpm 10+ ignore it.
packages:
  - '.'

onlyBuiltDependencies:
  - esbuild
  - vue-demi

allowBuilds:
  esbuild: true
  vue-demi: true
